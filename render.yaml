# Blueprint do Render (plano gratuito). No Render: New → Blueprint → escolha o repositório meu-fiscal.
# Só DATABASE_URL e DATABASE_URL_DIRECT são pedidos na criação; o resto já vem preenchido.
services:
  - type: web
    name: meufiscal-api
    runtime: node
    plan: free
    region: ohio                       # mesma região do banco no Neon (us-east-2)
    rootDir: api
    buildCommand: npm install --omit=dev --no-audit --no-fund   # instala só o módulo do WhatsApp (opcional)
    startCommand: npm start            # aplica o schema (idempotente) e sobe a API
    healthCheckPath: /api/vivo        # não consulta o banco (economiza as horas gratuitas do Neon)
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET_CLIENTE
        generateValue: true
      - key: JWT_SECRET_PAINEL
        generateValue: true
      - key: COFRE_CHAVE               # chave do cofre (certificados e senhas). NUNCA troque depois de usar: os segredos ficariam ilegíveis.
        generateValue: true
      - key: DATABASE_URL              # Neon, com Connection pooling ligado (tem "-pooler")
        sync: false
      - key: DATABASE_URL_DIRECT       # Neon, com Connection pooling desligado
        sync: false
      - key: ORIGENS_CLIENTE
        value: https://meufiscal-cliente.vercel.app
      - key: ORIGENS_PAINEL
        value: https://meufiscal-painel.vercel.app
      - key: URL_PUBLICA_API
        value: https://meufiscal-api.onrender.com
      # Arquivos no próprio banco nesta fase (até 4 MB cada). Para usar Neon Object Storage ou R2,
      # troque para s3 e acrescente S3_ENDPOINT, S3_REGIAO, S3_BUCKET, S3_ACCESS_KEY_ID e S3_SECRET_ACCESS_KEY.
      - key: ARQUIVOS_DRIVER
        value: banco
      # Primeira inicialização: cria o escritório e o master (link de senha aparece nos Logs)
      # e importa a carteira atual. Só age com o banco vazio; depois disso não faz nada.
      - key: ESCRITORIO_NOME
        value: Marcos Alexandre Ortiz · Contabilidade
      - key: MASTER_NOME
        value: Marcos Alexandre Ortiz
      - key: MASTER_EMAIL
        value: marcosortiz.cont@gmail.com
      - key: IMPORTAR_DADOS_INICIAIS
        value: "1"
      # Copiloto de IA gratuito: adicione GROQ_API_KEY em Environment (chave criada em console.groq.com, sem cartão)
