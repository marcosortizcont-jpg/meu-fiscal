function obrOk(o){return ['entregue','justificada','dispensada'].includes(o.status)}
function isoMenosDias(iso,n){if(!iso)return '';const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()-n);while([0,6].includes(d.getDay()))d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)}
function prazoTec(o){if(o.prazoTecnico)return o.prazoTecnico;const c=S.catalogo.find(x=>x.id===o.catId||x.nome===o.tipo);return isoMenosDias(o.prazo,c&&c.diasTecnico!=null?Number(c.diasTecnico):3)}
const dataDe=v=>v?String(v).slice(0,10):'';
function sitObr(o){
  const tec=prazoTec(o),leg=o.prazo,h=hoje();
  if(o.status==='entregue'){const d=dataDe(o.entregueEm);return d&&tec&&d<=tec?{k:'antecipada',t:'Ent. antecipada',c:'info',d}:d&&leg&&d<=leg?{k:'noprazo',t:'Ent. no prazo',c:'ok',d}:{k:'atrasada_ent',t:'Ent. com atraso',c:'warn',d}}
  if(o.status==='justificada')return{k:'justificada',t:'Justificada',c:'',d:dataDe(o.concluidaEm)};
  if(o.status==='dispensada')return{k:'dispensada',t:'Dispensada',c:'',d:dataDe(o.concluidaEm)};
  if(leg&&h>leg)return{k:'atrasada',t:'Atrasada',c:'crit'};
  if(tec&&h>tec)return{k:'fora_tec',t:'Fora do prazo técnico',c:'warn'};
  return o.status==='em_andamento'?{k:'andamento',t:'Em andamento',c:'info'}:{k:'pendente',t:'Pendente',c:'warn'};
}
const GRUPO_SIT=o=>['entregue','justificada','dispensada'].includes(o.status)?o.status==='entregue'?'entregues':o.status==='justificada'?'justificadas':'dispensadas':'pendentes';
function logObr(o,ev){(o.log=o.log||[]).push({em:agora(),uid:ME.id,nome:ME.nome||'Equipe',...ev});if(o.log.length>200)o.log.splice(0,o.log.length-200)}
const NOME_ST={pendente:'Pendente',em_andamento:'Em andamento',entregue:'Entregue',justificada:'Justificada',dispensada:'Dispensada'};
function mudarStatus(o,novo,extra){const de=o.status;if(de===novo)return;o.status=novo;
  if(novo==='entregue'){o.entregueEm=agora();o.entreguePor=ME.id}
  if(novo==='justificada'||novo==='dispensada'){o.concluidaEm=agora()}
  if(novo==='pendente'||novo==='em_andamento'){delete o.entregueEm;delete o.concluidaEm}
  logObr(o,{tipo:'status',de,para:novo,...(extra||{})})}

/* ---------- filtros ---------- */
function mesAtualIntervalo(){const h=hoje();return [h.slice(0,8)+'01',h.slice(0,8)+pad(ultimoDiaMes(+h.slice(0,4),+h.slice(5,7)))]}
function fobr(){if(!UI.fobr){const [a,b]=mesAtualIntervalo();UI.fobr={q:'',sit:{pendentes:true,justificadas:true,entregues:true,dispensadas:false},compDe:'',compAte:'',tecDe:'',tecAte:'',legDe:a,legAte:b,entDe:'',entAte:'',tags:[],ord:'legal',dir:1,pag:0}}return UI.fobr}
function linhasObr(){
  const f=fobr();const q=(f.q||'').toLowerCase().trim();const qd=soDig(q);
  const tag=k=>f.tags.filter(t=>t.k===k).map(t=>t.v);
  const tObr=tag('obr'),tResp=tag('resp'),tDep=tag('depto'),tEmp=tag('emp');
  const rows=S.obrigacoes.map(o=>{const e=emp(o.empresaId);if(!e)return null;return {o,e,tec:prazoTec(o),leg:o.prazo,sit:sitObr(o),guia:S.guias.find(g=>g.empresaId===o.empresaId&&g.comp===o.comp&&g.tipo===o.tipo),resp:o.responsavel||respDe(e,o.depto||'Fiscal')}}).filter(Boolean).filter(r=>{
    const o=r.o,e=r.e;
    if(!f.sit[GRUPO_SIT(o)])return false;
    if(q&&!([e.razao,e.fantasia,e.grupo,o.tipo,o.protocolo].join(' ').toLowerCase().includes(q)||(qd.length>=3&&soDig(e.cnpj).includes(qd))))return false;
    if(f.compDe&&o.comp<f.compDe)return false; if(f.compAte&&o.comp>f.compAte)return false;
    if(f.tecDe&&(!r.tec||r.tec<f.tecDe))return false; if(f.tecAte&&(!r.tec||r.tec>f.tecAte))return false;
    if(f.legDe&&(!r.leg||r.leg<f.legDe))return false; if(f.legAte&&(!r.leg||r.leg>f.legAte))return false;
    const dc=dataDe(o.entregueEm||o.concluidaEm);
    if(f.entDe&&(!dc||dc<f.entDe))return false; if(f.entAte&&(!dc||dc>f.entAte))return false;
    if(tObr.length&&!tObr.includes(o.tipo))return false;
    if(tResp.length&&!tResp.includes(r.resp))return false;
    if(tDep.length&&!tDep.includes(o.depto||''))return false;
    if(tEmp.length&&!tEmp.includes(e.id))return false;
    return true;
  });
  const nomeE=e=>(e.fantasia||e.razao||'').toLowerCase();
  const K={obr:r=>r.o.tipo.toLowerCase(),emp:r=>nomeE(r.e),tec:r=>r.tec||'9',legal:r=>r.leg||'9',comp:r=>r.o.comp,resp:r=>nomeEquipe(r.resp).toLowerCase()};
  const k=K[f.ord]||K.legal;
  return rows.sort((a,b)=>{const x=k(a),y=k(b);return (x<y?-1:x>y?1:0)*f.dir||nomeE(a.e).localeCompare(nomeE(b.e))});
}
const POR_PAG=50;

  const cont={pendentes:0,justificadas:0,entregues:0,dispensadas:0};S.obrigacoes.forEach(o=>cont[GRUPO_SIT(o)]++);

   <div class="obr-tags">${f.tags.map((t,i)=>`<span class="obr-tag">${esc(rotTag(t))}<button data-act="obr-tag-rm" data-i="${i}" aria-label="Remover filtro">×</button></span>`).join('')}

   </div>
   <div class="filtro-resumo"><span class="small muted">${rows.length} obrigação(ões)${atras?` · <b style="color:var(--crit)">${atras} atrasada(s)</b>`:''}${tecs?` · ${tecs} fora do prazo técnico`:''}</span><div class="actions"><button class="btn sm ghost" data-act="obr-rapido" data-v="mes">Prazo legal neste mês</button><button class="btn sm ghost" data-act="obr-rapido" data-v="semana">Vencem em 7 dias</button><button class="btn sm ghost" data-act="obr-rapido" data-v="atrasadas">Atrasadas</button></div></div>
  </div></div>`;
  const lote=UI.obrSel.size&&ed?`<div class="obr-lote nao-imprimir"><b>${UI.obrSel.size} selecionada(s)</b><button class="btn sm primary" data-act="obr-lote" data-v="entregue">Marcar entregues</button><button class="btn sm" data-act="obr-lote" data-v="dispensada">Dispensar</button><label class="small" style="display:flex;gap:6px;align-items:center">Responsável<select data-obr-lote-resp style="width:auto"><option value="">Escolha…</option>${eq.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></label><button class="btn sm ghost" data-act="obr-lote" data-v="limpar">Limpar seleção</button></div>`:'';
  const linha=r=>{const o=r.o,e=r.e,s=r.sit,aberta=UI.obrAberta===o.id;const cnpj=fmtCNPJ(e.cnpj);const nc=(o.comentarios||[]).length,na=(o.arquivos||[]).length;const enviado=(o.envios||[]).length;
    return `<tr class="obr-row ${aberta?'aberta':''}" data-act="obr-abrir" data-id="${o.id}">
     <td class="nao-imprimir" data-act="noop">${ed?`<input type="checkbox" data-obr-sel="${o.id}" ${UI.obrSel.has(o.id)?'checked':''} aria-label="Selecionar">`:''}</td>
     <td><div class="obr-nome ${obrOk(o)?'ok':''}">${esc(o.tipo)}</div><div>${esc(e.fantasia||e.razao)} <span class="small muted mono">[${cnpj.slice(-7)}]</span></div></td>
     <td><div>${r.tec?fmtData(r.tec).slice(0,6)+fmtData(r.tec).slice(8):'—'} ${pill(s.t+(s.d?' '+fmtData(s.d).slice(0,5):''),s.c)}${r.guia&&r.guia.valor?` <span title="Guia ${brl(r.guia.valor)}" style="color:var(--crit);font-weight:700">$</span>`:''}</div><div class="small">${esc(o.depto||'—')} · ${esc(nomeEquipe(r.resp)||'sem responsável')}</div></td>
     <td><div>${r.leg?fmtData(r.leg):'—'}</div><div class="small" style="color:var(--crit);font-weight:600">${fmtComp(o.comp)}</div></td>

   ${rows.length?`<div class="table-wrap"><table class="obr-tab"><thead><tr><th class="nao-imprimir">${ed?`<input type="checkbox" data-obr-sel-todas ${vis.length&&vis.every(r=>UI.obrSel.has(r.o.id))?'checked':''} aria-label="Selecionar todas">`:''}</th><th>${thO('obr','Obrigação')}<br>${thO('emp','Empresa')} [final CNPJ]</th><th>${thO('tec','Prazo técnico')} · situação<br>Depto · ${thO('resp','Responsável')}</th><th>${thO('legal','Prazo legal')}<br>${thO('comp','Competência')}</th><th class="col-esconde">Protocolo<br>Comentários e anexos</th></tr></thead><tbody>${vis.map(linha).join('')}</tbody></table></div>

function detalheObr(o,r){
  const ed=podeMod('obrig','editar');const exc=podeMod('obrig','excluir');const e=r.e;const eq=listaEquipe()||[];
  const canEmail=!!(e.email||(e.contatos||[]).some(c=>c.email));const canWa=!!(e.telefone||(e.contatos||[]).some(c=>c.telefone));
  const hist=[...(o.log||[])].sort((a,b)=>String(b.em).localeCompare(String(a.em)));
  const ev=l=>{let t='';
    if(l.tipo==='status')t=`<b>Mudou o status:</b> de ${pill(NOME_ST[l.de]||l.de||'—','')} para ${pill(NOME_ST[l.para]||l.para,l.para==='entregue'?'ok':l.para==='dispensada'||l.para==='justificada'?'':'warn')}${l.motivo?` · <i>${esc(l.motivo)}</i>`:''}`;
    else if(l.tipo==='anexo')t=`<b>Anexo:</b> ${l.arquivo&&l.arquivo.url?`<a href="${esc(l.arquivo.url)}" target="_blank" rel="noopener">${esc(l.arquivo.nome)}</a>`:esc(l.arquivo?.nome||'')}`;
    else if(l.tipo==='anexo_rm')t=`<b>Removeu o anexo:</b> ${esc(l.texto)}`;
    else if(l.tipo==='comentario')t=`<b>Comentário:</b> ${esc(l.texto)}`;
    else if(l.tipo==='envio')t=`<span style="color:var(--ok)">•</span> ${esc(l.texto)}`;
    else t=esc(l.texto||'');
    return `<div class="ev"><div class="quem">${esc(l.nome||'')} em ${fmtDH(l.em)}:${pad(new Date(l.em).getSeconds())}</div>${t}</div>`};
  return `<form data-form="obr-salvar" data-id="${o.id}" class="obr-det">
   <div><label class="f"><span>Número do protocolo da entrega</span><input name="protocolo" value="${esc(o.protocolo||'')}" maxlength="80" ${ed?'':'disabled'} placeholder="Ex.: recibo, número da declaração ou OK"></label>
    ${ed?`<button class="btn primary" style="width:100%;margin-top:8px">${o.status==='entregue'?'Salvar':'Entregue · Salvar'}</button>`:''}</div>
   <div><span class="small" style="font-weight:600;color:var(--muted)">${svg('clip')} Anexar arquivo (guia, recibo, declaração)</span>
    ${ed?`<label class="btn" style="width:100%;margin-top:4px">${svg('upload')}Escolher arquivos<input type="file" hidden multiple accept=".pdf,.jpg,.jpeg,.png,.xml,.txt,.csv" data-up="obr-anexo" data-id="${o.id}"></label>`:''}
    <div class="obr-anexos">${(o.arquivos||[]).map((a,i)=>`<span class="chip-anexo">${svg('clip')}${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(a.nome)}">${esc(a.nome)}</a>`:`<span>${esc(a.nome)}</span>`}${a.enviadoEm?' ✉':''}${exc?`<button type="button" data-act="obr-anexo-rm" data-id="${o.id}" data-i="${i}" aria-label="Remover ${esc(a.nome)}">×</button>`:''}</span>`).join('')||'<span class="small muted">Nenhum anexo.</span>'}</div></div>
   <div><label class="f"><span>Enviar ao cliente ao salvar?</span><select name="envio" ${ed?'':'disabled'}>
     <option value="nao">Não enviar</option><option value="portal" ${o.status!=='entregue'&&(o.arquivos||[]).some(a=>!a.enviadoEm)?'selected':''}>Portal do cliente</option>
     <option value="portal_email" ${canEmail?'':'disabled'}>Portal + e-mail${canEmail?'':' (sem e-mail no cadastro)'}</option>
     <option value="portal_whatsapp" ${canWa?'':'disabled'}>Portal + WhatsApp${canWa?'':' (sem telefone)'}</option>
     <option value="todos" ${canEmail&&canWa?'':'disabled'}>Portal + e-mail + WhatsApp</option></select></label>
    <p class="small muted" style="margin:6px 0 0">Só os anexos ainda não enviados seguem. Eles aparecem em "Documentos da empresa" no portal.</p></div>
   <div><div class="grid-f" style="grid-template-columns:1fr 1fr;gap:8px">
     <label class="f"><span>Prazo técnico</span><input type="date" name="prazoTecnico" value="${esc(prazoTec(o))}" ${ed?'':'disabled'}></label>
     <label class="f"><span>Responsável</span><select name="responsavel" ${ed?'':'disabled'}><option value="">—</option>${eq.map(p=>`<option value="${p.id}" ${p.id===r.resp?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></label></div></div>
   <div><label class="f"><span>Adicionar comentário</span><span style="display:flex;gap:6px"><input id="obr-com-${o.id}" maxlength="500" placeholder="Visível só para a equipe"><button type="button" class="btn sm" data-act="obr-comentar" data-id="${o.id}">Comentar</button></span></label></div>
   <div><label class="f"><span>Justificativa de atraso ou dispensa</span><input name="justificativa" maxlength="300" value="${esc(o.justificativa||'')}" ${ed?'':'disabled'}></label>
    ${ed?`<div class="actions" style="margin-top:6px">${obrOk(o)?`<button type="button" class="btn sm" data-act="obr-reabrir" data-id="${o.id}">Reabrir</button>`:`<button type="button" class="btn sm" data-act="obr-justificar" data-id="${o.id}" data-v="justificada">Justificar</button><button type="button" class="btn sm" data-act="obr-justificar" data-id="${o.id}" data-v="dispensada">Dispensar</button>`}</div>`:''}</div>
   <div class="obr-hist">${hist.length?hist.map(ev).join(''):'<p class="small muted">Sem movimentações ainda.</p>'}</div>
  </form>`;
}

  else{const d=new Date(h+'T12:00:00');d.setDate(d.getDate()-1);f.legDe='';f.legAte=d.toISOString().slice(0,10);f.sit={pendentes:true,justificadas:false,entregues:false,dispensadas:false}}
  render()};
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset.obrSit){fobr().sit[el.dataset.obrSit]=el.checked;fobr().pag=0;render()}
  else if(el.dataset.fobr){fobr()[el.dataset.fobr]=el.value;fobr().pag=0;render()}
  else if(el.dataset.obrTag){if(el.value&&!fobr().tags.some(t=>t.k===el.dataset.obrTag&&t.v===el.value))fobr().tags.push({k:el.dataset.obrTag,v:el.value});fobr().pag=0;render()}
  else if(el.dataset.obrSel){el.checked?UI.obrSel.add(el.dataset.obrSel):UI.obrSel.delete(el.dataset.obrSel);render()}
  else if(el.hasAttribute('data-obr-sel-todas')){const f=fobr();linhasObr().slice(f.pag*POR_PAG,(f.pag+1)*POR_PAG).forEach(r=>el.checked?UI.obrSel.add(r.o.id):UI.obrSel.delete(r.o.id));render()}
  else if(el.hasAttribute('data-obr-lote-resp')&&el.value){const ids=[...UI.obrSel];const p=el.value;
    mut('obrigacoes',()=>ids.forEach(id=>{const o=S.obrigacoes.find(x=>x.id===id);if(o&&o.responsavel!==p){logObr(o,{tipo:'resp',texto:'Responsável alterado para '+nomeEquipe(p)});o.responsavel=p}}),['Obrigações','Trocou responsável em lote',ids.length+' obrigações']);toast('Responsável atualizado.')}
});
Object.assign(buscaVivas,{'busca-obr':v=>{fobr().q=v;fobr().pag=0}});
ACT['obr-lote']=el=>{const v=el.dataset.v;const ids=[...UI.obrSel];
  if(v==='limpar'){UI.obrSel.clear();render();return}
  const fazer=motivo=>{mut('obrigacoes',()=>ids.forEach(id=>{const o=S.obrigacoes.find(x=>x.id===id);if(o&&!obrOk(o)){if(motivo)o.justificativa=motivo;mudarStatus(o,v,motivo?{motivo}:null)}}),['Obrigações',(v==='entregue'?'Entregou':'Dispensou')+' em lote',ids.length+' obrigações']);UI.obrSel.clear();toast(ids.length+' obrigação(ões) atualizada(s).')};

};

ACT['obr-reabrir']=el=>{const o=S.obrigacoes.find(x=>x.id===el.dataset.id);mut('obrigacoes',()=>mudarStatus(o,'pendente'),['Obrigações','Reabriu '+o.tipo,emp(o.empresaId)?.razao])};
ACT['obr-anexo-rm']=el=>{const o=S.obrigacoes.find(x=>x.id===el.dataset.id);const a=(o.arquivos||[])[Number(el.dataset.i)];if(!a)return;

ACT['obr-csv']=()=>{const L=linhasObr();const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const txt=['Obrigação;Empresa;CNPJ;Departamento;Responsável;Competência;Prazo técnico;Prazo legal;Situação;Data entrega/dispensa;Protocolo;Justificativa'].concat(L.map(r=>[r.o.tipo,r.e.razao,fmtCNPJ(r.e.cnpj),r.o.depto,nomeEquipe(r.resp),fmtComp(r.o.comp),r.tec?fmtData(r.tec):'',r.leg?fmtData(r.leg):'',r.sit.t,r.sit.d?fmtData(r.sit.d):'',r.o.protocolo,r.o.justificativa].map(c).join(';'))).join('\r\n');
  baixar('obrigacoes-'+hoje()+'.csv','﻿'+txt,'text/csv')};

FORM['obr-salvar']=async(fd,form)=>{
  const o=S.obrigacoes.find(x=>x.id===form.dataset.id);if(!o)return;const e=emp(o.empresaId);
  const prot=String(fd.get('protocolo')||'').trim(),tec=String(fd.get('prazoTecnico')||''),resp=String(fd.get('responsavel')||''),just=String(fd.get('justificativa')||'').trim(),envio=String(fd.get('envio')||'nao');
  const pend=(o.arquivos||[]).filter(a=>!a.enviadoEm);
  if(envio!=='nao'&&!pend.length){toast('Não há anexo novo para enviar. Anexe o arquivo ou escolha "Não enviar".',true);return}
  const canais=envio==='portal_email'?['email']:envio==='portal_whatsapp'?['whatsapp']:envio==='todos'?['email','whatsapp']:[];
  mut(['obrigacoes',...(envio!=='nao'?['documentos']:[])],()=>{
    if(prot!==(o.protocolo||'')){logObr(o,{tipo:'protocolo',texto:'Protocolo: '+(prot||'(apagado)')});o.protocolo=prot}
    if(tec&&tec!==prazoTec(o)){logObr(o,{tipo:'prazo',texto:'Prazo técnico alterado para '+fmtData(tec)});o.prazoTecnico=tec}
    if(resp!==(o.responsavel||'')&&resp){logObr(o,{tipo:'resp',texto:'Responsável alterado para '+nomeEquipe(resp)});o.responsavel=resp}
    if(just!==(o.justificativa||''))o.justificativa=just;
    if(o.status!=='entregue')mudarStatus(o,'entregue');
    if(envio!=='nao'){const quando=agora();pend.forEach(a=>{S.documentos.push({id:uid(),empresaId:o.empresaId,nome:`${o.tipo} ${fmtComp(o.comp)} · ${a.nome}`,categoria:'Obrigações entregues',arquivo:a,enviadoEm:quando,origem:'obrigacao',obrigacaoId:o.id});a.enviadoEm=quando});
      (o.envios=o.envios||[]).push({em:quando,canais:['portal',...canais]});logObr(o,{tipo:'envio',texto:`${fmtDH(quando)} ${pend.length>1?pend.length+' arquivos publicados':'Arquivo publicado'} no Portal do Cliente para ${e?.razao||''}`})}
  },['Obrigações','Entregou '+o.tipo+' '+fmtComp(o.comp),e?.razao]);
  toast(o.tipo+' marcada como entregue'+(envio!=='nao'?' e publicada no portal':'')+'.');
  if(canais.length){
    if(MODO!=='api'){toast('O envio por e-mail/WhatsApp funciona na versão publicada.',true);return}
    const ids=pend.map(a=>a.id).filter(Boolean);
    if(!ids.length){toast('Os anexos não foram guardados no servidor; envie de novo.',true);return}
    try{
      const r=await MF.api('POST','/api/envios/obrigacao',{empresaId:o.empresaId,arquivos:ids,nomes:pend.filter(a=>a.id).map(a=>a.nome),canais,
        assunto:`${o.tipo} · ${fmtComp(o.comp)} · ${e?.fantasia||e?.razao||''}`,
        mensagem:`Olá! Segue ${o.tipo} da competência ${fmtComp(o.comp)} de ${e?.fantasia||e?.razao||''}${o.prazo?', com vencimento em '+fmtData(o.prazo):''}. Qualquer dúvida, responda esta mensagem ou fale pelo Portal do Cliente. ${cfg().escritorio||''}`});
      const res=r.resultados||{};const rot={email:'e-mail',whatsapp:'WhatsApp'};
      mut('obrigacoes',()=>Object.entries(res).forEach(([k,v])=>logObr(o,{tipo:'envio',texto:v.ok?`${fmtDH(agora())} Enviada por ${rot[k]} para ${v.para}`:`Envio por ${rot[k]} falhou: ${v.erro}`})),null);
      const falhas=Object.entries(res).filter(([k,v])=>!v.ok);
      if(falhas.length)toast(falhas.map(([k,v])=>rot[k]+': '+v.erro).join(' · '),true);else toast('Enviada ao cliente por '+Object.keys(res).map(k=>rot[k]).join(' e ')+'.');
    }catch(er){toast(er.message,true);mut('obrigacoes',()=>logObr(o,{tipo:'envio',texto:'Envio ao cliente falhou: '+er.message}),null)}
  }
};

/* uploads novos: anexos da obrigação e comprovante de lançamento */
const onUploadV3=onUpload;
onUpload=async function(inp){
  const tipo=inp.dataset.up;
  if(tipo==='obr-anexo'){
    const o=S.obrigacoes.find(x=>x.id===inp.dataset.id);const files=[...inp.files];inp.value='';if(!o||!files.length)return;
    const antes=UI.empresaId;UI.empresaId=o.empresaId;
    try{const metas=[];for(const f of files){if(!['pdf','jpg','jpeg','png','xml','txt','csv'].includes(extDe(f.name))){toast(f.name+': formato não aceito.',true);continue}metas.push(await enviarArquivo(f))}
      if(metas.length)mut('obrigacoes',()=>{o.arquivos=o.arquivos||[];metas.forEach(m=>{o.arquivos.push({...m,anexadoEm:agora(),uid:ME.id});logObr(o,{tipo:'anexo',arquivo:m})})},['Obrigações','Anexou arquivo em '+o.tipo,emp(o.empresaId)?.razao]);
    }catch(er){toast(er.message,true)}finally{UI.empresaId=antes}
    return;
  }
  if(tipo==='lanc-comp'){const files=[...inp.files];inp.value='';if(!files.length)return;
    try{UI.lancComp=await enviarArquivo(files[0]);const s=document.getElementById('lanc-comp-nome');if(s)s.textContent=UI.lancComp.nome}catch(er){toast(er.message,true)}return}
  return onUploadV3(inp);
};

/* ==================== Cliente: lançamentos de receitas e despesas ==================== */
const CAT_REC=[['servicos','Prestação de serviços'],['vendas','Venda de produtos'],['comissoes','Comissões e intermediações'],['financeiras','Receitas financeiras (rendimentos e juros)'],['aportes','Aportes e empréstimos recebidos'],['outras_rec','Outras receitas']];
const CAT_DESP=[['mercadorias','Compra de mercadorias e matéria-prima','custo'],['custo_servico','Custo direto do serviço (terceiros)','custo'],['salarios','Salários, encargos e benefícios','pessoal'],['prolabore','Pró-labore','pessoal'],['impostos','Impostos, taxas e guias','impostos'],
  ['aluguel','Aluguel e condomínio','operacional'],['utilidades','Energia, água, internet e telefone','operacional'],['marketing','Marketing e publicidade','operacional'],['sistemas','Sistemas e assinaturas','operacional'],['servicos_prof','Contabilidade e serviços profissionais','operacional'],
  ['transporte','Combustível, transporte e fretes','operacional'],['manutencao','Manutenção e limpeza','operacional'],['material','Material de escritório e consumo','operacional'],['viagens','Viagens e alimentação','operacional'],
  ['tarifas','Tarifas bancárias, juros e taxas de cartão','financeiro'],['investimentos','Equipamentos e investimentos','nao_operacional'],['emprestimos','Empréstimos pagos e retiradas dos sócios','nao_operacional'],['outras_desp','Outras despesas','operacional']];
const GRUPO_DESP={custo:'Custos diretos',pessoal:'Pessoal',impostos:'Impostos e taxas',operacional:'Despesas operacionais',financeiro:'Despesas financeiras',nao_operacional:'Não operacional (investimentos e retiradas)'};
const FORMAS=['Pix','Transferência','Boleto','Cartão de crédito','Cartão de débito','Dinheiro','Débito automático','Outra'];
const nomeCat=(tipo,k)=>((tipo==='receita'?CAT_REC:CAT_DESP).find(c=>c[0]===k)||[k,k])[1];
const grupoCat=k=>(CAT_DESP.find(c=>c[0]===k)||[,,'operacional'])[2];
const CORES=['#059669','#2563eb','#d97706','#7c3aed','#db2777','#0891b2','#65a30d','#dc2626','#475569','#9333ea','#0d9488','#ea580c'];
// despesas declaradas no modelo antigo entram nos indicadores
function lancamentosDe(eid){
  const L=S.lancamentos.filter(l=>l.empresaId===eid);
  S.despesas.filter(d=>d.empresaId===eid).forEach(d=>L.push({id:'old-'+d.id,antigo:true,empresaId:eid,tipo:'despesa',data:d.comp+'-01',comp:d.comp,descricao:d.descricao||d.fornecedor||'Despesa declarada',contraparte:d.fornecedor||'',categoria:d.categoria==='CMV'?'mercadorias':d.categoria==='Custo do serviço'?'custo_servico':'outras_desp',valor:Number(d.valor)||0,situacao:'realizado'}));
  return L;
}
function periodoLanc(){const p=UI.lancPer||'12m';const ca=compAtual();
  if(p==='mes')return [ca,ca];if(p==='ant')return [addMes(ca,-1),addMes(ca,-1)];if(p==='3m')return [addMes(ca,-2),ca];if(p==='6m')return [addMes(ca,-5),ca];if(p==='ano')return [ca.slice(0,4)+'-01',ca];return [addMes(ca,-11),ca]}
const PERIODOS=[['mes','Este mês'],['ant','Mês passado'],['3m','Últimos 3 meses'],['6m','Últimos 6 meses'],['ano','Este ano'],['12m','Últimos 12 meses']];
function barrasCat(lista,total,vazioTxt){
  if(!lista.length)return `<p class="small muted">${vazioTxt}</p>`;
  const max=Math.max(...lista.map(x=>x.v));
  return `<div class="barras">${lista.map((x,i)=>`<div class="barra"><span title="${esc(x.n)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.n)}</span><span class="trilho"><i style="width:${max?Math.max(2,x.v/max*100):0}%;background:${CORES[i%CORES.length]}"></i></span><span class="num small">${brl(x.v)} <span class="muted">${total?pct(x.v/total):''}</span></span></div>`).join('')}</div>`;
}
function somaPor(L,chave){const m={};L.forEach(l=>{const k=chave(l);m[k]=(m[k]||0)+Number(l.valor||0)});return Object.entries(m).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v)}
const vBIV1=vBI;
vBI=function(e){
  const t=UI.tab.lanc||'visao';
  const abas=`<div class="tabs" role="tablist">${[['visao','Visão geral'],['receitas','Receitas'],['despesas','Despesas'],['consolidacao','Consolidação'],['indicadores','Indicadores fiscais']].map(([k,r])=>`<button role="tab" aria-selected="${t===k}" data-act="tab" data-k="lanc" data-v="${k}">${r}</button>`).join('')}</div>`;
  const acoes=`<button class="btn" data-act="lanc-novo" data-v="despesa">${svg('plus')}Despesa</button><button class="btn primary" data-act="lanc-novo" data-v="receita">${svg('plus')}Receita</button>`;
  const cab=head('Gestão do negócio','Lance as receitas e despesas da empresa e acompanhe de onde vem o dinheiro, para onde ele vai e quanto sobra. Os dados são seus e o escritório também enxerga, para orientar você.',acoes);
  if(t==='indicadores'){const h=vBIV1(e);return cab+abas+h.slice(h.indexOf('<div class="kpis">'))}
  if(t==='receitas'||t==='despesas')return cab+abas+listaLanc(e,t==='receitas'?'receita':'despesa');
  if(t==='consolidacao')return cab+abas+consolidacao(e);
  return cab+abas+visaoGeral(e);
};
function seletorPeriodo(){return `<div class="filtros" role="group" aria-label="Período">${PERIODOS.map(([k,r])=>`<button aria-pressed="${(UI.lancPer||'12m')===k}" data-act="lanc-per" data-v="${k}">${r}</button>`).join('')}</div>`}
function visaoGeral(e){
  const [de,ate]=periodoLanc();const L=lancamentosDe(e.id).filter(l=>l.comp>=de&&l.comp<=ate);
  const R=L.filter(l=>l.tipo==='receita'&&l.situacao!=='pendente'),D=L.filter(l=>l.tipo==='despesa'&&l.situacao!=='pendente');
  const rec=R.reduce((a,l)=>a+Number(l.valor),0),desp=D.reduce((a,l)=>a+Number(l.valor),0);
  const aRec=lancamentosDe(e.id).filter(l=>l.tipo==='receita'&&l.situacao==='pendente').reduce((a,l)=>a+Number(l.valor),0);
  const aPag=lancamentosDe(e.id).filter(l=>l.tipo==='despesa'&&l.situacao==='pendente').reduce((a,l)=>a+Number(l.valor),0);
  const res=rec-desp;const marg=rec?res/rec:null;
  const opRec=R.filter(l=>!['aportes','financeiras'].includes(l.categoria)&&l.situacao!=='pendente').reduce((a,l)=>a+Number(l.valor),0);
  const meses=[];for(let c=de;c<=ate;c=addMes(c,1))meses.push(c);const nM=meses.length||1;
  // série mensal (últimos 12 meses sempre, para o gráfico)
  const ca=compAtual();const serie=[];for(let i=11;i>=0;i--){const c=addMes(ca,-i);const x=lancamentosDe(e.id).filter(l=>l.comp===c&&l.situacao!=='pendente');serie.push({c,r:x.filter(l=>l.tipo==='receita').reduce((a,l)=>a+Number(l.valor),0),d:x.filter(l=>l.tipo==='despesa').reduce((a,l)=>a+Number(l.valor),0)})}
  const maxS=Math.max(1,...serie.map(s=>Math.max(s.r,s.d)));
  const recCat=somaPor(R,l=>nomeCat('receita',l.categoria)),despCat=somaPor(D,l=>nomeCat('despesa',l.categoria));
  const recCli=somaPor(R.filter(l=>l.contraparte),l=>l.contraparte).slice(0,5),despForn=somaPor(D.filter(l=>l.contraparte),l=>l.contraparte).slice(0,5);
  const maiores=D.slice().sort((a,b)=>b.valor-a.valor).slice(0,5);
  // variação da maior categoria de despesa contra o período anterior
  const durac=nM;const deAnt=addMes(de,-durac),ateAnt=addMes(de,-1);
  const Dant=lancamentosDe(e.id).filter(l=>l.tipo==='despesa'&&l.situacao!=='pendente'&&l.comp>=deAnt&&l.comp<=ateAnt);
  const varCat=despCat.slice(0,6).map(x=>{const ant=Dant.filter(l=>nomeCat('despesa',l.categoria)===x.n).reduce((a,l)=>a+Number(l.valor),0);return {...x,ant,var:ant?(x.v-ant)/ant:null}}).filter(x=>x.var!=null&&x.var>0.15).sort((a,b)=>b.var-a.var)[0];
  const insights=[];
  if(!L.length)insights.push(['info','Ainda não há lançamentos no período. Comece pelo botão "+ Receita" ou "+ Despesa".']);
  if(rec&&res<0)insights.push(['crit',`As despesas passaram as receitas em ${brl(-res)} no período.`]);
  if(recCat[0]&&rec&&recCat[0].v/rec>0.7&&recCat.length>1)insights.push(['warn',`${pct(recCat[0].v/rec)} da receita vem de "${recCat[0].n}". Depender de uma só fonte aumenta o risco.`]);
  if(recCli[0]&&rec&&recCli[0].v/rec>0.4)insights.push(['warn',`O cliente "${recCli[0].n}" representa ${pct(recCli[0].v/rec)} da receita.`]);
  if(varCat)insights.push(['warn',`"${varCat.n}" subiu ${pct(varCat.var)} em relação ao período anterior (${brl(varCat.ant)} → ${brl(varCat.v)}).`]);
  if(marg!=null&&marg>=0.2)insights.push(['ok',`Margem de ${pct(marg)}: para cada R$ 100 que entram, sobram ${brl(100*marg)}.`]);
  if(aPag)insights.push(['info',`Há ${brl(aPag)} em contas a pagar lançadas como pendentes.`]);
  return `<div class="panel" style="padding:10px 14px">${seletorPeriodo()}</div>
  <div class="lanc-kpis">
   <div class="kpi"><span class="eyebrow">Receitas</span><b style="color:var(--ok)">${brl(rec)}</b><small>média ${brl(rec/nM)} por mês</small></div>
   <div class="kpi"><span class="eyebrow">Despesas</span><b style="color:var(--crit)">${brl(desp)}</b><small>média ${brl(desp/nM)} por mês</small></div>
   <div class="kpi"><span class="eyebrow">Resultado</span><b style="color:${res<0?'var(--crit)':'var(--navy)'}">${brl(res)}</b><small>${marg==null?'sem receitas no período':'margem de '+pct(marg)}</small></div>
   <div class="kpi"><span class="eyebrow">A receber</span><b>${brl(aRec)}</b><small>receitas pendentes</small></div>
   <div class="kpi"><span class="eyebrow">A pagar</span><b>${brl(aPag)}</b><small>despesas pendentes</small></div>
   <div class="kpi"><span class="eyebrow">Ticket médio</span><b>${R.length?brl(rec/R.length):'—'}</b><small>${R.length} receita(s) recebida(s)</small></div>
  </div>
  ${insights.length?`<div class="panel"><h2>O que os números mostram</h2><div class="alerts">${insights.map(([n,t])=>`<div class="alert ${n==='ok'?'info':n}"><span class="sev"></span><div><p>${esc(t)}</p></div></div>`).join('')}</div></div>`:''}
  <div class="panel"><div class="panel-head"><h2>Receitas × despesas por mês</h2><span class="small muted"><span style="color:#059669">■</span> receitas · <span style="color:#dc2626">■</span> despesas · últimos 12 meses</span></div>
   <div class="graf-mes">${serie.map(s=>`<div class="col" title="${fmtComp(s.c)}: receitas ${brl(s.r)} · despesas ${brl(s.d)} · resultado ${brl(s.r-s.d)}"><div class="par"><i style="height:${s.r/maxS*100}%;background:#059669"></i><i style="height:${s.d/maxS*100}%;background:#dc2626"></i></div><small>${fmtComp(s.c).slice(0,3)}</small></div>`).join('')}</div></div>

function consolidacao(e){
  const ano=UI.lancAno||compAtual().slice(0,4);const meses=[];for(let m=1;m<=12;m++)meses.push(ano+'-'+pad(m));
  const L=lancamentosDe(e.id).filter(l=>l.comp.startsWith(ano+'-')&&l.situacao!=='pendente');
  const soma=(f,c)=>L.filter(l=>l.comp===c&&f(l)).reduce((a,l)=>a+Number(l.valor),0);
  const linha=(rot,f,cls)=>{const vs=meses.map(c=>soma(f,c));const t=vs.reduce((a,b)=>a+b,0);return {rot,vs,t,cls}};
  const recOp=linha('Receita operacional',l=>l.tipo==='receita'&&!['financeiras','aportes'].includes(l.categoria),'tot');
  const recCats=CAT_REC.map(([k,r])=>linha('  '+r,l=>l.tipo==='receita'&&l.categoria===k,'sub')).filter(x=>x.t);
  const G=k=>linha('(−) '+GRUPO_DESP[k],l=>l.tipo==='despesa'&&grupoCat(l.categoria)===k,'');
  const custos=G('custo'),pessoal=G('pessoal'),impostos=G('impostos'),oper=G('operacional'),fin=G('financeiro'),nop=G('nao_operacional');
  const recFin=linha('(+) Receitas financeiras',l=>l.tipo==='receita'&&l.categoria==='financeiras','');
  const aportes=linha('(+) Aportes e empréstimos recebidos',l=>l.tipo==='receita'&&l.categoria==='aportes','');
  const calc=(rot,fn,cls)=>{const vs=meses.map((c,i)=>fn(i));return {rot,vs,t:vs.reduce((a,b)=>a+b,0),cls}};
  const bruto=calc('= Lucro bruto',i=>recOp.vs[i]-custos.vs[i],'tot');
  const operac=calc('= Resultado operacional',i=>bruto.vs[i]-pessoal.vs[i]-impostos.vs[i]-oper.vs[i],'tot');
  const liquido=calc('= Resultado do período',i=>operac.vs[i]+recFin.vs[i]-fin.vs[i],'tot');
  const caixa=calc('= Geração de caixa (após investimentos e retiradas)',i=>liquido.vs[i]+aportes.vs[i]-nop.vs[i],'tot');
  const L2=[recOp,...recCats,custos,bruto,pessoal,impostos,oper,operac,recFin,fin,liquido,aportes,nop,caixa];
  const anos=[...new Set(lancamentosDe(e.id).map(l=>l.comp.slice(0,4)).concat([compAtual().slice(0,4)]))].sort().reverse();
  const margem=recOp.t?liquido.t/recOp.t:null;
  return `<div class="panel"><div class="panel-head"><div><h2>Demonstrativo de resultado simplificado · ${ano}</h2><p class="sub">Receitas e despesas já recebidas ou pagas, agrupadas como numa DRE. ${margem!=null?'Margem líquida no ano: <b>'+pct(margem)+'</b>.':''}</p></div><div class="actions"><select data-lanc-ano style="width:auto">${anos.map(a=>`<option ${a===ano?'selected':''}>${a}</option>`).join('')}</select><button class="btn sm" data-act="lanc-dre-csv">${svg('download')}Exportar</button><button class="btn sm" data-act="ctrl-imprimir">Imprimir / PDF</button></div></div>
  <div class="table-wrap"><table class="dre"><thead><tr><th>Conta</th>${meses.map(c=>`<th class="num">${fmtComp(c).slice(0,3)}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>${L2.map(x=>`<tr class="${x.cls}"><td style="white-space:nowrap">${esc(x.rot)}</td>${x.vs.map(v=>`<td class="num ${v<0?'neg':''}" style="${v<0?'color:var(--crit)':''}">${v?brl(v).replace('R$ ',''):'—'}</td>`).join('')}<td class="num" style="${x.t<0?'color:var(--crit)':''}">${brl(x.t)}</td></tr>`).join('')}</tbody></table></div>
  <p class="small muted">Valores em reais. Lançamentos pendentes (a receber e a pagar) entram quando forem marcados como recebidos ou pagos.</p></div>`;
}

/* ---------- motor: o que cada empresa deve em cada competência ---------- */
const inicioControle=e=>e.inicioControle||addMes(compAtual(),-1);
function itensDaEmpresa(e){
  const r=regimeDe(e);const doReg=r?r.obrigacoes||[]:[];const leg=new Set(e.obrigRemovidas||[]);
  const ids=[...new Set([...doReg,...(e.obrigExtras||[]),...Object.keys(e.obrigRemov2||{})])].filter(id=>!leg.has(id));
  return ids.map(id=>S.catalogo.find(c=>c.id===id)).filter(o=>o&&o.ativo!==false).map(o=>({o,origem:doReg.includes(o.id)?'regime':'avulsa',desde:(e.obrigExtrasDesde||{})[o.id]||null,removidaEm:(e.obrigRemov2||{})[o.id]||null}));
}
function itensAtivosNaComp(e,comp){return itensDaEmpresa(e).filter(x=>devidaNaComp(x.o,comp)&&(!x.desde||comp>=x.desde)&&!(x.removidaEm&&comp>=x.removidaEm))}
function faixaComps(f){
  // competências que podem cair nos filtros: anuais vencem até ~19 meses depois da competência
  const ca=compAtual();let de=f.compDe||'',ate=f.compAte||'';
  const legDe=f.legDe||f.tecDe,legAte=f.legAte||f.tecAte;
  if(!de)de=legDe?addMes(legDe.slice(0,7),-20):addMes(ca,-3);
  if(!ate)ate=legAte?legAte.slice(0,7):ca;
  if(ate<de)return [];const out=[];for(let c=de;c<=ate&&out.length<48;c=addMes(c,1))out.push(c);return out;
}
function obrigacoesFaixa(comps){
  const salvas=S.obrigacoes;const chave=(eid,c,cat,tipo)=>eid+'|'+c+'|'+(cat||tipo);
  const idx=new Set();salvas.forEach(o=>{idx.add(chave(o.empresaId,o.comp,o.catId,o.tipo));idx.add(chave(o.empresaId,o.comp,null,o.tipo))});
  const out=salvas.slice();const cset=new Set(comps);
  S.empresas.forEach(e=>{
    const ini=inicioControle(e);const itens=itensDaEmpresa(e);if(!itens.length)return;
    comps.forEach(c=>{
      if(c<ini)return;if(e.status==='inativo'&&c>=(e.inativoDesde||ini))return;
      itens.forEach(x=>{
        if(!devidaNaComp(x.o,c)||(x.desde&&c<x.desde))return;
        if(idx.has(chave(e.id,c,x.o.id,x.o.nome))||idx.has(chave(e.id,c,null,x.o.nome)))return;
        const dispensada=x.removidaEm&&c>=x.removidaEm;
        out.push({id:`v:${e.id}:${c}:${x.o.id}`,virtual:true,empresaId:e.id,comp:c,tipo:x.o.nome,prazo:vencimentoDe(x.o,c),depto:x.o.depto,catId:x.o.id,
          status:dispensada?'dispensada':'pendente',responsavel:respDe(e,x.o.depto),...(dispensada?{justificativa:'Removida do cadastro da empresa a partir de '+fmtComp(x.removidaEm)}:{})});
      });
    });
  });
  return out;
}
// transforma a obrigação calculada em registro guardado na primeira ação sobre ela
function obrPorId(id){
  if(!id)return null;let o=S.obrigacoes.find(x=>x.id===id);if(o)return o;
  if(!String(id).startsWith('v:'))return null;
  const [,eid,comp,cat]=String(id).split(':');const e=emp(eid);const c=S.catalogo.find(x=>x.id===cat);if(!e||!c)return null;
  o={id:uid(),empresaId:eid,comp,tipo:c.nome,prazo:vencimentoDe(c,comp),depto:c.depto,catId:c.id,status:'pendente',responsavel:respDe(e,c.depto),criadaEm:agora()};
  const rem=(e.obrigRemov2||{})[c.id];if(rem&&comp>=rem){o.status='dispensada';o.justificativa='Removida do cadastro da empresa a partir de '+fmtComp(rem);o.concluidaEm=agora()}
  S.obrigacoes.push(o);
  if(UI.obrAberta===id)UI.obrAberta=o.id;if(UI.obrSel&&UI.obrSel.has(id)){UI.obrSel.delete(id);UI.obrSel.add(o.id)}
  return o;
}

/* lista: usa obrigações guardadas + calculadas do cadastro */
function linhasObrV5(f){
  const q=(f.q||'').toLowerCase().trim();const qd=soDig(q);
  const tag=k=>f.tags.filter(t=>t.k===k).map(t=>t.v);const tObr=tag('obr'),tResp=tag('resp'),tDep=tag('depto'),tEmp=tag('emp');
  const base=obrigacoesFaixa(faixaComps(f));
  const todas=base.map(o=>{const e=emp(o.empresaId);if(!e)return null;return {o,e,tec:prazoTec(o),leg:o.prazo,sit:sitObr(o),guia:S.guias.find(g=>g.empresaId===o.empresaId&&g.comp===o.comp&&g.tipo===o.tipo),resp:o.responsavel||respDe(e,o.depto||'Fiscal')}}).filter(Boolean);
  const semSit=todas.filter(r=>{const o=r.o,e=r.e;
    if(q&&!([e.razao,e.fantasia,e.grupo,o.tipo,o.protocolo].join(' ').toLowerCase().includes(q)||(qd.length>=3&&soDig(e.cnpj).includes(qd))))return false;
    if(f.compDe&&o.comp<f.compDe)return false;if(f.compAte&&o.comp>f.compAte)return false;
    if(f.tecDe&&(!r.tec||r.tec<f.tecDe))return false;if(f.tecAte&&(!r.tec||r.tec>f.tecAte))return false;
    if(f.legDe&&(!r.leg||r.leg<f.legDe))return false;if(f.legAte&&(!r.leg||r.leg>f.legAte))return false;
    const dc=dataDe(o.entregueEm||o.concluidaEm);if(f.entDe&&(!dc||dc<f.entDe))return false;if(f.entAte&&(!dc||dc>f.entAte))return false;
    if(tObr.length&&!tObr.includes(o.tipo))return false;if(tResp.length&&!tResp.includes(r.resp))return false;
    if(tDep.length&&!tDep.includes(o.depto||''))return false;if(tEmp.length&&!tEmp.includes(e.id))return false;return true});
  const cont={pendentes:0,justificadas:0,entregues:0,dispensadas:0};semSit.forEach(r=>cont[GRUPO_SIT(r.o)]++);
  const rows=semSit.filter(r=>f.sit[GRUPO_SIT(r.o)]);
  const nomeE=e=>(e.fantasia||e.razao||'').toLowerCase();
  const K={obr:r=>r.o.tipo.toLowerCase(),emp:r=>nomeE(r.e),tec:r=>r.tec||'9',legal:r=>r.leg||'9',comp:r=>r.o.comp,resp:r=>nomeEquipe(r.resp).toLowerCase()};const k=K[f.ord]||K.legal;
  rows.sort((a,b)=>{const x=k(a),y=k(b);return (x<y?-1:x>y?1:0)*f.dir||nomeE(a.e).localeCompare(nomeE(b.e))});
  return {rows,cont};
}

motor=function(eid,publico){
  const A=motorV3(eid,publico);if(publico!=='a'||!S.catalogo.length)return A;
  const ca=compAtual();const comps=[addMes(ca,-3),addMes(ca,-2),addMes(ca,-1),ca];const h=hoje();
  const lista=obrigacoesFaixa(comps).filter(o=>o.virtual&&o.status==='pendente'&&o.prazo<h&&(!eid||o.empresaId===eid));
  const por={};lista.forEach(o=>{(por[o.empresaId]=por[o.empresaId]||[]).push(o)});

    for(const f of files){if(f.size>20*1024*1024){toast(f.name+': acima de 20 MB.',true);continue}if(!EXT_CHAT.includes(extDe(f.name))){toast(f.name+': formato não suportado.',true);continue}ok.push(f)}
    UI.iaAnexos=UI.iaAnexos.concat(ok).slice(0,5);render();const i=$('#ia-input');if(i)i.focus();return}
  if(inp.dataset.up==='hum-anexo'){const files=[...inp.files];inp.value='';return enviarArquivosHumano(inp.dataset.id,files)}
  return onUploadV5(inp);
};

/* ---------- painel: arquivos, emojis e áudio na resposta ---------- */
async function enviarArquivosHumano(convId,files){
  const c=S.conversas.find(x=>x.id===convId);if(!c||!files.length)return;
  const validos=files.filter(f=>{if(!EXT_CHAT.includes(extDe(f.name))){toast(f.name+': formato não suportado.',true);return false}return true});if(!validos.length)return;
  const antes=UI.empresaId;UI.empresaId=c.empresaId||null;const arquivos=[];
  try{for(const f of validos){const m=await enviarArquivo(f);if(!m.id&&MODO==='api')throw new Error('Não foi possível guardar '+f.name+'.');arquivos.push(m)}}catch(er){toast(er.message,true);UI.empresaId=antes;return}
  UI.empresaId=antes;
  const inp=$('#hum-input');const texto=(inp?.value||'').trim();if(inp)inp.value='';
  if(c.canal==='whatsapp'){
    try{await MF.api('POST','/api/whatsapp/enviar',{conversaId:c.id,texto,arquivos:arquivos.map(a=>({id:a.id,nome:a.nome,tipo:TIPOS_UP[extDe(a.nome)]||a.tipo,tamanho:a.tamanho}))});toast('Enviado pelo WhatsApp.')}catch(er){toast(er.message,true)}
    return;
  }
  mut('conversas',()=>{if(c.status!=='humano'){c.status='humano';c.atendenteUid=ME.id;c.mensagens.push({de:'sistema',texto:(primeiroNome(ME.nome)||'Um atendente')+' assumiu a conversa.',em:agora()})}
    c.mensagens.push({de:'humano',texto:texto||(arquivos.every(ehAudio)?'🎤 Mensagem de voz':''),em:agora(),uid:ME.id,nome:ME.nome||'',arquivos})},['Atendimento','Enviou arquivo no atendimento',emp(c.empresaId)?.razao]);
}

const trechoMsg=m=>{const t=String(m.texto||'').replace(/\s*CONFIAN[CÇ]A:.*$/i,'').trim();if(t&&!/^🎤 Mensagem de voz$/.test(t))return t.slice(0,140);const a=(m.arquivos||[])[0];return a?(ehAudio(a)?'🎤 Áudio':/image\//.test(a.tipo||'')||/\.(png|jpe?g|webp|gif)$/i.test(a.nome||'')?'📷 Foto':'📎 '+(a.nome||'Arquivo')):t||'Mensagem'};

FORM['contato']=(fd,form)=>{
  const id=form.dataset.id;const nome=String(fd.get('nome')||'').trim();const tel=soDig(fd.get('telefone'));const email=String(fd.get('email')||'').trim().toLowerCase();
  if(nome.length<2){toast('Informe o nome.',true);return}
  if(tel&&(tel.length<10||tel.length>13)){toast('WhatsApp inválido: informe DDD e número.',true);return}
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){toast('E-mail inválido.',true);return}
  if(!tel&&!email){toast('Informe pelo menos o WhatsApp ou o e-mail.',true);return}
  const dup=tel&&S.contatos.find(c=>c.id!==id&&chaveFoneC(c.telefone)===chaveFoneC(tel));if(dup){toast('Já existe um contato com este WhatsApp: '+dup.nome+'.',true);return}
  const marcadas=[...form.querySelectorAll('input[name=empresas]:checked')].map(i=>i.value);
  const antes=id?S.contatos.find(c=>c.id===id):null;const ordem=antes?[...(antes.empresas||[]).filter(e=>marcadas.includes(e)),...marcadas.filter(e=>!(antes.empresas||[]).includes(e))]:marcadas;
  const dados={nome,cargo:String(fd.get('cargo')||'').trim(),telefone:tel,email,empresas:ordem,atendente:String(fd.get('atendente')||''),canal:String(fd.get('canal')||'whatsapp'),
    recebeWhatsApp:!!fd.get('recebeWhatsApp'),recebeEmail:!!fd.get('recebeEmail'),ativo:id?!!fd.get('ativo'):true,obs:String(fd.get('obs')||'').trim(),atualizadoEm:agora()};
  let novoId=id;
  mut(['contatos','conversas'],()=>{
    if(antes)Object.assign(antes,dados);else{novoId='ct-'+uid();S.contatos.push({id:novoId,...dados,criadoEm:agora(),criadoPor:ME.id})}
    // conversas do WhatsApp com este número passam a usar o contato (empresa e atendente)
    if(tel)S.conversas.filter(c=>c.canal==='whatsapp'&&c.status!=='encerrada'&&chaveFoneC(c.waFone)===chaveFoneC(tel)).forEach(c=>{c.contatoId=novoId;c.contatoNome=nome;if(!c.empresaId&&ordem[0])c.empresaId=ordem[0];if(!c.atendenteUid&&dados.atendente)c.atendenteUid=dados.atendente});
  },['Atendimento',(antes?'Editou':'Cadastrou')+' contato '+nome,ordem.map(e=>emp(e)?.razao).filter(Boolean).join(', ')]);
  closeModal();toast('Contato salvo.');
};

const aChatV8=aChat;
aChat=function(){
  const t=UI.tab.atend||'caixa';
  const inj=h=>h.replace(/(<button role="tab" aria-selected="(?:true|false)" data-act="tab" data-k="atend" data-v="historico">)/,`<button role="tab" aria-selected="${t==='contatos'}" data-act="tab" data-k="atend" data-v="contatos">Contatos (${S.contatos.length})</button>$1`);
  if(t==='contatos'){const abas=`<div class="tabs" role="tablist">${[['caixa','Caixa de entrada'],['contatos','Contatos ('+S.contatos.length+')'],['historico','Histórico de atendimentos']].map(([k,r])=>`<button role="tab" aria-selected="${t===k}" data-act="tab" data-k="atend" data-v="${k}">${r}</button>`).join('')}</div>`;
    return head('Atendimento','Contatos dos clientes: empresas que cada um representa, atendente responsável e quem recebe as guias pelo WhatsApp e e-mail.')+abas+contatosView()}
  let h=inj(aChatV8());
  const m=h.match(/<form class="composer" data-form="msg-humano" data-id="([^"]+)">/);
  if(t==='caixa'&&m){const c=S.conversas.find(x=>x.id===m[1]);
    if(c&&c.canal==='whatsapp'&&podeMod('chat','editar')){const ct=c.contatoId&&S.contatos.find(x=>x.id===c.contatoId);
      const b=ct?`<button class="btn sm ghost" data-act="cont-form" data-id="${ct.id}">Contato: ${esc(primeiroNome(ct.nome))}</button>`:`<button class="btn sm" data-act="cont-form" data-nome="${esc(c.contatoNome||'')}" data-fone="${esc(c.waFone||'')}" data-empresa="${esc(c.empresaId||'')}">Salvar contato</button>`;
      h=h.replace(/(data-act="encerrar-conv" data-id="[^"]+">Encerrar<\/button>)/,'$1'+b)}}
  return h;
};

  const wa=cs.filter(c=>c.telefone&&c.recebeWhatsApp!==false);const em=cs.filter(c=>c.email&&c.recebeEmail!==false);
  const waTxt=wa.length?wa.map(c=>esc(primeiroNome(c.nome))+' '+fmtFone(String(c.telefone).replace(/^55(?=\d{10,11}$)/,''))).join(', '):e.telefone?'telefone do cadastro '+fmtFone(e.telefone):'';
  const emTxt=[...new Set([...em.map(c=>c.email),e.email].filter(Boolean))].join(', ');
  if(wa.length)h=h.replace(/<option value="portal_whatsapp" disabled>Portal \+ WhatsApp \(sem telefone\)<\/option>/,'<option value="portal_whatsapp">Portal + WhatsApp</option>');
  if(em.length)h=h.replace(/<option value="portal_email" disabled>Portal \+ e-mail \(sem e-mail no cadastro\)<\/option>/,'<option value="portal_email">Portal + e-mail</option>');
  if(!/value="portal_whatsapp" disabled/.test(h)&&!/value="portal_email" disabled/.test(h))h=h.replace(/<option value="todos" disabled>/,'<option value="todos">');
  const dica=`<p class="small muted" style="margin:6px 0 0">WhatsApp: ${waTxt||'<b style="color:var(--warn)">nenhum contato</b> (cadastre em Atendimento › Contatos)'}<br>E-mail: ${esc(emTxt)||'nenhum'}</p>`;
  return h.replace('<p class="small muted" style="margin:6px 0 0">Só os anexos ainda não enviados seguem.',dica+'<p class="small muted" style="margin:6px 0 0">Só os anexos ainda não enviados seguem.');
};

function okParc(p){return `✓ ${esc(p.nome)} · ${esc(docTxt(p))}${!p.semDoc&&!p.doc?' <a href="#" data-act="parc-form" data-id="'+p.id+'">completar</a>':''}`}
function sugestoesParc(eid,tipo,q){
  const qn=normTxt(q);const qd=soDig(q);const toks=qn.split(' ').filter(Boolean);const U=usoParceiro(eid);const pref=tiposDoLanc(tipo);
  const L=parceirosDe(eid).filter(p=>p.ativo!==false).map(p=>{const nomes=[normTxt(p.nome),normTxt(p.fantasia)].filter(Boolean);const pal=nomes.join(' ').split(' ');
    let s=0;if(!toks.length)s=1;
    else if(qd.length>=3&&qd.length===String(q).replace(/[\s.\/-]/g,'').length){if(soDig(p.doc).includes(qd))s=5}
    else if(toks.every(t=>pal.some(w=>w.startsWith(t)))){s=nomes.some(n=>n.startsWith(qn))?4:pal.some(w=>w.startsWith(toks[0]))?3:2}
    else if(nomes.some(n=>n.includes(qn)))s=1;
    if(!s)return null;return {p,s:s*10+((p.tipos||[]).some(t=>pref.includes(t))?5:0)+Math.min(4,(U[p.id]?.n||0)/5)}}).filter(Boolean);
  return L.sort((a,b)=>b.s-a.s||a.p.nome.localeCompare(b.p.nome)).slice(0,8).map(x=>x.p);

const perguntarIAV10=perguntarIA;
perguntarIA=async function(texto){
  const e=empAtual();
  if(MODO!=='api'||!e||!(ehMeiE(e)||String(e.regimeId||'').startsWith('reg2-sn')||e.regime==='SN'||(e.integra&&(e.integra.dctfweb||(e.integra.parcelamentos||[]).length)))||!texto||UI.iaAnexos.length||UI.iaDraft!=null)return perguntarIAV10(texto);
  const c0=conversaAtiva(e.id,false);if(c0&&c0.status!=='ia')return perguntarIAV10(texto);
  if(!UI.dasConversa&&!PEDE_GUIA_C.test(texto))return perguntarIAV10(texto);
  let c;mut('conversas',()=>{c=conversaAtiva(e.id,true);c.mensagens.push({de:'cliente',texto,em:agora(),uid:ME.id,nome:ME.nome||''})},null);
  UI.iaDraft='';render();
  let r;try{r=await MF.api('POST','/api/theo/das',{empresaId:e.id,conversaId:c.id,texto})}catch(er){r={tratado:false,erroApi:er.message}}
  UI.iaDraft=null;
  if(!r.tratado){UI.dasConversa=false;
    // não era pedido de guia: segue com o Théo normal (sem repetir a mensagem do cliente)
    const ult=c.mensagens.at(-1);if(ult&&ult.de==='cliente'&&ult.texto===texto){c.mensagens.pop()}
    return perguntarIAV10(texto)}
  UI.dasConversa=!!r.continua;
  mut('conversas',()=>{c.mensagens.push({de:'ia',texto:r.texto,em:agora(),confianca:'alta',...(r.arquivo?{arquivos:[r.arquivo]}:{})});
    if(r.passarEquipe){c.status='aguardando_humano';c.mensagens.push({de:'sistema',texto:'O Théo não conseguiu emitir o DAS e chamou a equipe.',em:agora()})}},r.arquivo?['Atendimento','Théo enviou o DAS-MEI',e.razao]:null);
};

function resumoCad(){const f=document.querySelector('form[data-form=cad-ativ]');if(!f)return;const v=Number(f.valor.value)||0;const r=UI.cadVoucher&&UI.cadVoucher.codigo===f.voucher.value.trim().toUpperCase()?UI.cadVoucher:null;

    plano:{nome:g('planoNome')||g('planoSel'),valor:Number(g('valor')),diaVenc:Number(g('diaVenc'))||10},metodo:'bolepix',voucher:g('voucher'),leadId:form.dataset.lead||null,avisar:!!fd.get('avisar')};
  try{const r=await MF.api('POST','/api/ativacao/cadastrar',corpo);UI.cadVoucher=null;closeModal();

      ${r.pix?`<div class="f"><span>PIX copia e cola</span><div class="linha-dig" style="word-break:break-all">${esc(r.pix)}</div><div class="actions" style="margin-top:6px"><button class="btn sm" data-act="copiar" data-t="${esc(r.pix)}">Copiar PIX</button></div></div>`:''}
      ${r.linha?`<div class="f"><span>Linha digitável do boleto</span><div class="linha-dig">${esc(r.linha)}</div><div class="actions" style="margin-top:6px"><button class="btn sm" data-act="copiar" data-t="${esc(r.linha)}">Copiar linha</button></div></div>`:''}
      ${r.link?`<div class="f"><span>Link de pagamento</span><div class="linha-dig">${esc(r.link)}</div><div class="actions" style="margin-top:6px"><button class="btn sm" data-act="copiar" data-t="${esc(r.link)}">Copiar link</button></div></div>`:''}
      ${r.aviso?`<p class="small muted">${esc([r.aviso.whatsapp,r.aviso.email].filter(Boolean).join(' · '))}</p>`:''}</div><div class="modal-foot"><button class="btn primary" data-act="close-modal">Entendi</button></div>`)}

const RE_TOAST_OK=/salv|atualizad|cadastrad|registrad|criad|enviad|entregue|conclu|transferid|vinculad|inclu[ií]d|removid|exclu[ií]d|confirmad|definid|ativad|alterad|publicad|importad|gerad/i;
let TOAST_ERR=0,TOAST_OK=0;
toast=function(m,err){const t=document.createElement('div');const ok=!err&&RE_TOAST_OK.test(String(m));t.className='toast'+(err?' err':ok?' ok':'');t.setAttribute('role',err?'alert':'status');
  if(ok)t.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>${esc(m)}</span>`;else t.textContent=m;
  const box=$('#toasts');if(box)box.appendChild(t);if(err)TOAST_ERR++;else TOAST_OK++;setTimeout(()=>t.remove(),err?6500:3800)};

document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('form[data-form] button:not([type=button])');if(b)UI.ultimoSubmit=b},true);
function contextoSalvar(form){
  const b=UI.ultimoSubmit&&UI.ultimoSubmit.form===form?UI.ultimoSubmit:form.querySelector('button:not([type=button])');UI.ultimoSubmit=null;
  if(b&&(b.name==='mais'||/outr[oa]|nov[oa]\b|e incluir/i.test(b.textContent||'')))return null;const txt=(b&&b.textContent||'').trim();const emModal=!!form.closest('#overlay');
  if(form.dataset.form==='ticket-ev')return {fechar:()=>closeModal(),msg:'Demanda atualizada com sucesso.'};
  if(UI.modo==='painel'&&UI.view==='a-carteira'&&UI.cart&&UI.cart.id&&!emModal&&/salvar/i.test(txt))return {fechar:()=>ACT['cart-voltar'](),msg:'Cadastro do cliente salvo com sucesso.'};
  if(emModal&&/salvar/i.test(txt))return {fechar:()=>{if(form.isConnected)closeModal()},msg:'Alterações salvas com sucesso.'};
  return null;
}
for(const k of Object.keys(FORM)){const base=FORM[k];FORM[k]=async function(fd,form){const ctx=contextoSalvar(form);const e0=TOAST_ERR,o0=TOAST_OK;const r=await base(fd,form);

async function preencherReceita(form,manual){

  try{const {dados:d}=await MF.api('GET','/api/cnpj/'+cnpj);if(soDig(form.cnpj.value)!==cnpj)return;

    if(form.regime)form.regime.value=d.regime==='MEI'?'MEI':d.regime==='SN'?'SN':'OUTRO';

    resumoCad()}
  catch(er){out.innerHTML=`<b style="color:var(--crit)">${esc(er.message)}</b>`;form.dataset.receita=''}}

   <form data-form="plano-alterar" data-id="${e.id}" class="grid-f">

    <label class="f"><span>Novo plano</span><select name="planoSel" data-plano-alt>${PLANOS_CAD.map(([n,g,v])=>`<option value="${esc(n)}" data-v="${v}" ${n===(ag?.nome||p.nome)?'selected':''}>${esc(n)} · ${g} · ${brl(v)}</option>`).join('')}<option value="__outro" ${PLANOS_CAD.some(x=>x[0]===(ag?.nome||p.nome))?'':'selected'}>Outro / sob medida</option></select></label>
    <label class="f"><span>Nome do plano</span><input name="nome" maxlength="60" required value="${esc(ag?.nome||p.nome||'')}"></label>
    <label class="f"><span>Novo honorário mensal (R$) *</span><input name="valor" type="number" min="1" step="0.01" required value="${esc(ag?.valor||p.valor||'')}" data-plano-valor></label>
    <label class="f"><span>Funcionários inclusos</span><input name="funcInclusos" type="number" min="0" value="${Number((ag||p).funcInclusos||0)}"></label>
    <label class="f"><span>Adicional por funcionário (R$)</span><input name="adicionalFunc" type="number" min="0" step="0.01" value="${Number((ag||p).adicionalFunc||0)}"></label>
    <label class="f"><span>Dia do vencimento</span><input name="diaVenc" type="number" min="1" max="28" value="${Number((ag||p).diaVenc||10)}"></label>
    <label class="f full"><span>Motivo (vai no contrato)</span><input name="motivo" maxlength="200" placeholder="ex.: contratação de funcionários, mudança para o Simples"></label>
    <div class="f full"><div class="linha-dig" id="plano-dif" style="font-family:inherit"></div></div>
    <div class="actions full"><button class="btn primary">Agendar e gerar novo contrato</button></div></form></div>`:'';
  const c=e.contrato;const hist=[...(e.contratos||[])].reverse();
  const contratos=`<div class="panel"><div class="panel-head"><h2>Contratos de prestação de serviços</h2>${c?pill(...(ST_CONTRATO[c.status]||['—',''])):''}</div>
   ${painelContrato(e).replace(/^<div class="panel"[^>]*><div class="panel-head">[\s\S]*?<\/div>/,'').replace(/<\/div>$/,'')}
   ${c?.vigencia?`<p class="small">Vigência deste contrato: a partir de ${fmtData(c.vigencia)}${c.alteracao?.anterior?.numero?' · substitui o nº '+esc(c.alteracao.anterior.numero):''}.</p>`:''}
   ${hist.length?`<h3 style="margin:14px 0 6px">Contratos anteriores</h3><div class="list">${hist.map(x=>`<div class="row"><div class="grow"><b>Nº ${esc(x.numero||'')}</b> · ${esc(x.plano||'')} · ${brl(x.valor||0)}/mês<div class="small muted">${x.substituidoEm?'substituído em '+fmtData(x.substituidoEm):''}${x.status==='assinado'?' · assinado':' · sem assinatura anexada'}</div></div>${x.arquivoId?linkArq({url:x.url,nome:x.nome},'PDF'):''}${x.assinado?linkArq({url:x.assinado.url,nome:x.assinado.nome},'Assinado'):''}</div>`).join('')}</div>`:''}</div>`;
  const fin=`<div class="panel"><div class="panel-head"><h2>Honorários no Financeiro</h2></div>${futuras.length?`<div class="list">${futuras.map(f=>`<div class="row"><div class="grow"><b>${fmtComp(f.comp)}</b> · vence ${fmtData(f.venc)}${f.atualizadaPorPlano?' · <span class="small">atualizada pelo novo plano</span>':''}</div><b class="num">${brl(f.valor)}</b></div>`).join('')}</div>`:'<p class="small muted">Nenhuma mensalidade em aberto. As próximas são geradas pelo Financeiro já com o plano vigente na competência.</p>'}</div>`;
  const histPl=(e.planosHistorico||[]).length?`<div class="panel"><h2>Histórico de alterações do plano</h2><div class="list">${[...e.planosHistorico].reverse().map(x=>`<div class="row"><div class="grow"><b>${esc(TIPO_ALT[x.tipo]||x.tipo)}</b> · ${esc(x.de?.plano||x.de?.nome||'')} ${x.de?.valor?brl(x.de.valor):''}${x.para?' → '+esc(x.para.nome)+' '+brl(x.para.valor):''}<div class="small muted">${fmtDH(x.em)} · ${esc(x.por||'')}${x.vigencia?' · vigência '+fmtData(x.vigencia):''}${x.contrato?' · contrato '+esc(x.contrato):''}</div></div></div>`).join('')}</div></div>`:'';
  setTimeout(difPlano,30);
  return `<div class="cols-2-1" style="align-items:start"><div>${atual}${alterar}</div><div>${contratos}${fin}${histPl}</div></div>`}
function difPlano(){const f=document.querySelector('form[data-form=plano-alterar]');const box=document.getElementById('plano-dif');if(!f||!box)return;const e=emp(f.dataset.id);const v=Number(f.valor.value)||0;const a=Number(e?.plano?.valor||0);const d=Math.round((v-a)*100)/100;
  box.innerHTML=`Hoje: <b>${brl(a)}</b> → a partir de ${fmtData(proxComp()+'-01')}: <b>${brl(v)}</b> ${d?`(${d>0?'+':''}${brl(d)}/mês${a?', '+(d>0?'+':'')+(d/a*100).toFixed(1).replace('.',',')+'%':''})`:'(mesmo valor)'}`}
document.addEventListener('input',ev=>{if(ev.target.closest&&ev.target.closest('form[data-form=plano-alterar]'))difPlano()});
document.addEventListener('change',ev=>{const s=ev.target;if(!s.matches||!s.matches('[data-plano-alt]'))return;const f=s.form;const o=s.selectedOptions[0];if(o.dataset.v){f.valor.value=o.dataset.v;f.nome.value=s.value}else{f.nome.value='';f.nome.focus()}difPlano()});
FORM['plano-alterar']=(fd,form)=>{const e=emp(form.dataset.id);const v=Number(fd.get('valor'));if(!(v>0)){toast('Informe o novo valor.',true);return}
  confirmar('Agendar alteração do plano',`<b>${esc(e.fantasia||e.razao)}</b> passa para <b>${esc(fd.get('nome'))} · ${brl(v)}/mês</b> a partir de <b>${fmtData(proxComp()+'-01')}</b>. Um novo contrato será gerado para assinatura e os honorários serão atualizados no Financeiro.`,'Agendar e gerar contrato',async()=>{
    try{const r=await MF.api('POST',`/api/planos/${encodeURIComponent(e.id)}/alterar`,{tipo:fd.get('tipo'),nome:fd.get('nome'),valor:v,funcInclusos:Number(fd.get('funcInclusos')||0),adicionalFunc:Number(fd.get('adicionalFunc')||0),diaVenc:Number(fd.get('diaVenc')||10),motivo:fd.get('motivo')});
      MF.aplicarRemoto?.('empresas',{...emp(e.id),contrato:r.contrato,planoAgendado:r.planoAgendado});render();toast('Alteração agendada para '+fmtData(r.planoAgendado.vigencia)+'. Baixe o novo contrato para coletar as assinaturas.')}catch(er){toast(er.message,true)}})};
ACT['plano-cancelar-ag']=el=>confirmar('Cancelar alteração agendada','O plano atual continua valendo e o novo contrato é descartado (o anterior volta a ser o vigente).','Cancelar alteração',async()=>{
  try{await MF.api('POST',`/api/planos/${encodeURIComponent(el.dataset.id)}/cancelar-agendamento`,{});toast('Alteração cancelada.')}catch(er){toast(er.message,true)}});
FORM['plano-ajuste']=(fd,form)=>{const e=emp(form.dataset.id);const n=k=>Math.max(0,Number(fd.get(k)||0));
  mut('empresas',()=>{e.plano={...(e.plano||{}),funcInclusos:n('funcInclusos'),adicionalFunc:n('adicionalFunc'),diaVenc:Math.min(28,Math.max(1,n('diaVenc')||10))}},['Carteira','Ajustou dados do plano',e.razao]);toast('Plano atualizado.')};
/* ==== MÓDULOS v20 (fim) ==== */


/* ==== MÓDULOS v21: mensalidade paga pelo banco no portal (boleto + QR Code PIX do Inter); chave PIX só como reserva ==== */
const modalPixFaturaV21=modalPixFatura;
modalPixFatura=function(f){
  if(MODO!=='api'||!f)return modalPixFaturaV21(f);
  openModal(`${mHead('Pagar mensalidade de '+fmtCompL(f.comp))}<div class="modal-body"><p class="small muted">Gerando o boleto com QR Code PIX…</p></div>`);
  MF.api('POST',`/api/faturas/${encodeURIComponent(f.id)}/cobranca`,{}).then(r=>{
    if(r.pago){toast('Esta mensalidade já está paga. ✔');closeModal();return}
    if(!r.banco)return modalPixFaturaV21(f);
    const b=r.boleto;
    openModal(`${mHead('Pagar mensalidade de '+fmtCompL(f.comp))}<div class="modal-body">
     <div class="pix"><div class="pix-qr" id="pix-fat-b"><span class="small muted">Gerando QR Code…</span></div>
      <div style="display:flex;flex-direction:column;gap:10px;min-width:0"><div><span class="eyebrow">Valor</span><div class="fat-total">${brl(b.valor)}</div><span class="sub">Honorários ${fmtComp(f.comp)} · vence ${fmtData(b.venc)}</span></div>
       ${b.pix?`<div><span class="eyebrow">PIX copia e cola</span><div class="pix-code">${esc(b.pix)}</div></div><button type="button" class="btn primary" data-act="copiar" data-t="${esc(b.pix)}">${svg('pix')}Copiar código PIX</button>`:''}
       ${b.linha?`<div><span class="eyebrow">Boleto (linha digitável)</span><div class="pix-code">${esc(b.linha)}</div></div><button type="button" class="btn" data-act="copiar" data-t="${esc(b.linha)}">Copiar linha do boleto</button>`:''}
       ${b.url?linkArq({url:b.url,nome:b.nome},'Baixar boleto (PDF)'):''}
       <span class="sub">Pague pelo app do seu banco. A baixa é automática: assim que o banco confirmar, a mensalidade aparece como paga.</span></div></div></div>
     <div class="modal-foot"><button class="btn" data-act="fat-verificar" data-id="${f.id}">Já paguei · conferir</button><button class="btn primary" data-act="close-modal">Fechar</button></div>`,true);
    if(b.pix)setTimeout(()=>desenharQR('pix-fat-b',b.pix),0);else{const q=document.getElementById('pix-fat-b');if(q)q.innerHTML='<span class="small muted">Use o boleto ao lado.</span>'}
  }).catch(er=>{toast('Não deu para gerar a cobrança no banco agora ('+er.message+').',true);modalPixFaturaV21(f)})};
ACT['fat-verificar']=async el=>{el.disabled=true;try{const r=await MF.api('POST',`/api/faturas/${encodeURIComponent(el.dataset.id)}/verificar`,{});toast(r.pago?'Pagamento confirmado. ✔':'O banco ainda não confirmou. PIX costuma cair em segundos; boleto, em até 2 dias úteis.',!r.pago);if(r.pago)closeModal()}catch(er){toast(er.message,true)}el.disabled=false};
// Configurações: a chave PIX vira reserva quando o banco está conectado
const aConfigV21=aConfig;
aConfig=function(){let h=aConfigV21();if(MODO!=='api'||!podeMod('hon','ver'))return h;const fb=finApi().dados;
  if(fb?.conectado&&fb.provedor!=='manual')h=h.replace(/(<span>Chave PIX[^<]*<\/span>)/,`$1<span class="small" style="color:var(--ok);font-weight:400">Inter conectado: todas as cobranças saem pelo banco. Esta chave só é usada se o banco ficar fora do ar.</span>`);
  return h};
/* ==== MÓDULOS v21 (fim) ==== */


lerHash();
(window.MF&&window.MF.site)?MF.iniciar():iniciar();
</script>
